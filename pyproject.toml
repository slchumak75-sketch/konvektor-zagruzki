[project]
name = "konvektor-zagruzki"
version = "1.3.9"
description = "Конвертер счетов, накладных и прайс-листов в единую Excel-таблицу по образцу"
requires-python = ">=3.9"
dependencies = ["xlrd>=2.0.1,<3", "openpyxl>=3.1,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
