[project]
name = "konvektor-zagruzki"
version = "2.0.1"
description = "Конвертор счетов, накладных и прайс-листов в единую Excel-таблицу по образцу"
requires-python = ">=3.9"
dependencies = ["xlrd>=2.0.1,<3", "openpyxl>=3.1,<4", "olefile>=0.47,<1", "striprtf>=0.0.26", "pdfplumber>=0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
