name: Сборка Windows-приложения

# Сборка запускается автоматически после любых изменений в репозитории:
#   * push в любую ветку;
#   * pull request;
#   * ручной запуск из вкладки Actions;
#   * тег вида v1.0.0 — дополнительно публикуется релиз с готовыми .exe.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ тесты
  test:
    name: Тесты и самопроверка (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      - name: Самопроверка на файлах-образцах
        run: python -m konvektor.cli --selftest . -q

  # ------------------------------------------------- приложение для Windows
  build-windows:
    name: Сборка .exe (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Собрать оконную версию (Konvertor.exe)
        shell: pwsh
        run: >
          pyinstaller --noconfirm --onefile --noconsole --noupx
          --name Konvertor
          --icon assets/konvektor.ico
          --add-data "assets/konvektor_icon.png;assets"
          app_gui.py

      - name: Собрать консольную версию (Konvertor-cli.exe)
        shell: pwsh
        run: >
          pyinstaller --noconfirm --onefile --console --noupx
          --name Konvertor-cli
          --icon assets/konvektor.ico
          app_cli.py

      - name: Проверить собранные .exe
        shell: pwsh
        run: |
          .\dist\Konvertor-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Konvertor-cli.exe --version: код $LASTEXITCODE" }
          if (-not (Test-Path .\dist\Konvertor.exe)) { throw "Konvertor.exe не собран" }
          Get-Item .\dist\Konvertor.exe, .\dist\Konvertor-cli.exe | Format-Table Name, Length

      - name: Упаковать в ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Force dist\Konvertor.exe package\
          Copy-Item -Force dist\Konvertor-cli.exe package\
          if (Test-Path README.md) { Copy-Item -Force README.md package\README.md }
          Compress-Archive -Path package\* -DestinationPath Konvertor-windows.zip -Force

      - name: Сохранить готовые файлы
        uses: actions/upload-artifact@v4
        with:
          name: Konvertor-windows
          path: |
            dist/Konvertor.exe
            dist/Konvertor-cli.exe
            Konvertor-windows.zip
          retention-days: 90

      - name: Опубликовать релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Konvertor.exe
            dist/Konvertor-cli.exe
            Konvertor-windows.zip
          generate_release_notes: true
          body: |
            Готовые файлы для Windows:

            * `Konvertor.exe` — оконная программа (просто запустить).
            * `Konvertor-cli.exe` — консольная версия для пакетной обработки.
            * `Konvertor-windows.zip` — оба файла + инструкция.

            Скачайте ZIP, распакуйте в любую папку и запустите `Konvertor.exe`.
